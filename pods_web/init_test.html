<!DOCTYPE html>
<html>
<head>
    <title>Quick Pods Initialization Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #canvas-container {
            width: 800px;
            height: 600px;
            background: #ECF0F1;
            border: 2px solid #2C3E50;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Pods Initialization Test</h1>
    <p>This page tests if the JavaScript initializes without errors.</p>

    <div id="status-container">
        <div class="status info">⏳ Loading...</div>
    </div>

    <div id="canvas-container">
        <canvas id="podsCanvas"></canvas>
    </div>

    <h3>Console Output:</h3>
    <pre id="console-output" style="background: #f5f5f5; padding: 10px; max-height: 300px; overflow-y: auto;"></pre>

    <script>
        // Capture console logs
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleOutput.textContent += '[LOG] ' + args.join(' ') + '\n';
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            consoleOutput.textContent += '[ERROR] ' + args.join(' ') + '\n';
        };
    </script>

    <script src="/static/js/pods.js"></script>

    <script>
        // Check if app initialized successfully
        setTimeout(() => {
            const statusContainer = document.getElementById('status-container');

            if (window.podsApp) {
                statusContainer.innerHTML = `
                    <div class="status success">
                        ✅ <strong>Success!</strong> Pods app initialized without errors.
                        <br>Canvas size: ${window.podsApp.canvas.width} x ${window.podsApp.canvas.height}
                        <br>Pods: ${window.podsApp.pods.length}
                        <br>Relationships: ${window.podsApp.relationships.length}
                    </div>
                `;
            } else {
                statusContainer.innerHTML = `
                    <div class="status error">
                        ❌ <strong>Error!</strong> Pods app failed to initialize.
                        <br>Check the console output below for details.
                    </div>
                `;
            }
        }, 2000);
    </script>
</body>
</html>
