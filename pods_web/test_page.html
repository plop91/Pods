<!DOCTYPE html>
<html>
<head>
    <title>Pods Test</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #status { padding: 20px; background: #f0f0f0; }
        #canvas-container { height: 600px; background: #ECF0F1; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div id="status">
        <h2>Pods JavaScript Test</h2>
        <p>Check browser console for logs.</p>
        <button onclick="testAPI()">Test API</button>
        <div id="result"></div>
    </div>
    <div id="canvas-container">
        <canvas id="podsCanvas"></canvas>
    </div>

    <script>
        console.log('Test page loaded');

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            try {
                const response = await fetch('/api/pods/root/');
                const data = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('API test successful:', data);
            } catch (error) {
                resultDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
                console.error('API test failed:', error);
            }
        }

        // Test canvas
        const canvas = document.getElementById('podsCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // Draw a test circle
            ctx.fillStyle = '#3498DB';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 50, 0, 2 * Math.PI);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Canvas Works!', canvas.width/2, canvas.height/2);

            console.log('Canvas test successful:', canvas.width, 'x', canvas.height);
        }
    </script>
</body>
</html>
